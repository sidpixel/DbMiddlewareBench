<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中间件压测仪表板</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0f172a;
            --secondary: #1e293b;
            --accent: #06b6d4;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --border: #334155;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: var(--text-primary);
            overflow-x: hidden;
        }

        /* 装饰背景 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(6, 182, 212, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(16, 185, 129, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* 标题区域 */
        .header {
            text-align: center;
            margin-bottom: 50px;
            animation: slideDown 0.8s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header h1 {
            font-size: 3.5rem;
            font-weight: 900;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--accent), var(--success));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -2px;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* 控制面板 */
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
            padding: 30px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border);
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-group label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .control-group input,
        .control-group select {
            padding: 10px 12px;
            background: var(--secondary);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .control-group input:focus,
        .control-group select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.1);
        }

        .btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--accent), #0891b2);
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            grid-column: 1 / -1;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(6, 182, 212, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn.danger {
            background: linear-gradient(135deg, var(--danger), #dc2626);
        }

        /* 状态指示器 */
        .status-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 40px;
        }

        .status-card {
            padding: 20px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border);
            border-radius: 8px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .status-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .status-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .status-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent);
        }

        .status-card.success .status-value {
            color: var(--success);
        }

        .status-card.danger .status-value {
            color: var(--danger);
        }

        /* 主体网格 */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .card {
            padding: 25px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: 10px;
            backdrop-filter: blur(10px);
            overflow: hidden;
            transition: all 0.3s ease;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card:hover {
            border-color: var(--accent);
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.15);
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .chart-container {
            position: relative;
            height: 300px;
            margin-bottom: 20px;
        }

        /* 结果表格 */
        .results-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .results-table thead {
            background: rgba(6, 182, 212, 0.1);
            border-bottom: 2px solid var(--accent);
        }

        .results-table th {
            padding: 12px;
            text-align: left;
            color: var(--accent);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .results-table td {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            color: var(--text-primary);
        }

        .results-table tbody tr:hover {
            background: rgba(6, 182, 212, 0.05);
        }

        .metric-value {
            font-weight: 700;
            color: var(--success);
        }

        .metric-value.warning {
            color: var(--warning);
        }

        .metric-value.danger {
            color: var(--danger);
        }

        /* 进度条 */
        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--secondary);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--success));
            border-radius: 4px;
            animation: loading 0.5s ease-out;
        }

        @keyframes loading {
            from {
                width: 0;
            }
            to {
                width: var(--progress, 0%);
            }
        }

        /* 响应式设计 */
        @media (max-width: 1200px) {
            .grid {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2.5rem;
            }
        }

        /* 加载动画 */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .hidden {
            display: none;
        }

        /* 通知 */
        .notification {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 15px 20px;
            background: var(--secondary);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            z-index: 1000;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .notification.success {
            border-color: var(--success);
        }

        .notification.error {
            border-color: var(--danger);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 标题 -->
        <div class="header">
            <h1>⚡ 压测仪表板</h1>
            <p>实时监控 Redis/MySQL/MongoDB/RabbitMQ 性能</p>
        </div>

        <!-- 控制面板 -->
        <div class="controls">
            <div class="control-group">
                <label for="workers">工作线程数</label>
                <input type="number" id="workers" value="20" min="1" max="100">
            </div>
            <div class="control-group">
                <label for="operations">每客户端操作数</label>
                <input type="number" id="operations" value="100" min="10" max="10000">
            </div>
            <div class="control-group">
                <label for="timeout">超时时间 (秒)</label>
                <input type="number" id="timeout" value="60" min="10" max="600">
            </div>
            <div class="control-group">
                <label for="services">选择服务</label>
                <select id="services" multiple>
                    <option value="redis" selected>Redis</option>
                    <option value="mysql" selected>MySQL</option>
                    <option value="mongodb" selected>MongoDB</option>
                    <option value="rabbitmq" selected>RabbitMQ</option>
                </select>
            </div>
            <button class="btn" onclick="startBenchmark()">开始压测</button>
            <button class="btn danger" onclick="stopBenchmark()">停止压测</button>
        </div>

        <!-- 状态指示 -->
        <div class="status-bar">
            <div class="status-card">
                <div class="status-label">状态</div>
                <div class="status-value" id="statusValue">就绪</div>
            </div>
            <div class="status-card success">
                <div class="status-label">成功操作</div>
                <div class="status-value" id="successValue">0</div>
            </div>
            <div class="status-card danger">
                <div class="status-label">失败操作</div>
                <div class="status-value" id="failureValue">0</div>
            </div>
            <div class="status-card">
                <div class="status-label">平均延迟</div>
                <div class="status-value" id="avgValue">0ms</div>
            </div>
        </div>

        <!-- 进度 -->
        <div class="card hidden" id="progressCard">
            <div class="card-title">执行进度</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="--progress: 0%"></div>
            </div>
            <p style="margin-top: 10px; color: var(--text-secondary);">
                <span id="progressText">0%</span> - <span class="spinner" id="spinner"></span>
            </p>
        </div>

        <!-- 图表和结果网格 -->
        <div class="grid">
            <!-- 延迟分布 -->
            <div class="card">
                <div class="card-title">延迟分布</div>
                <div class="chart-container">
                    <canvas id="latencyChart"></canvas>
                </div>
            </div>

            <!-- 吞吐量对比 -->
            <div class="card">
                <div class="card-title">吞吐量对比</div>
                <div class="chart-container">
                    <canvas id="throughputChart"></canvas>
                </div>
            </div>

            <!-- 详细结果 -->
            <div class="card" style="grid-column: 1 / -1;">
                <div class="card-title">详细结果</div>
                <div style="overflow-x: auto;">
                    <table class="results-table">
                        <thead>
                            <tr>
                                <th>服务</th>
                                <th>总操作</th>
                                <th>成功率</th>
                                <th>平均延迟</th>
                                <th>P95</th>
                                <th>P99</th>
                                <th>吞吐量</th>
                            </tr>
                        </thead>
                        <tbody id="resultsTableBody">
                            <tr>
                                <td colspan="7" style="text-align: center; color: var(--text-secondary);">
                                    等待压测数据...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        let charts = {};
        let benchmarkRunning = false;
        let mockResults = null;

        // 模拟数据生成（实际应从后端获取）
        function generateMockResults() {
            const services = ['Redis', 'MySQL', 'MongoDB', 'RabbitMQ'];
            const results = {};

            services.forEach(service => {
                const baseLat = Math.random() * 50 + 10;
                results[service] = {
                    name: service,
                    total_operations: 2000,
                    successful_operations: Math.floor(2000 * (0.95 + Math.random() * 0.05)),
                    failed_operations: Math.floor(2000 * (Math.random() * 0.05)),
                    min_latency_ms: baseLat * 0.3,
                    avg_latency_ms: baseLat,
                    p50_latency_ms: baseLat * 0.95,
                    p95_latency_ms: baseLat * 2.5,
                    p99_latency_ms: baseLat * 4,
                    max_latency_ms: baseLat * 6,
                    throughput_ops_per_sec: 33 + Math.random() * 17
                };
            });

            return results;
        }

        function updateStatusCards(results) {
            let totalSuccess = 0, totalFailure = 0, totalLatency = 0, count = 0;

            Object.values(results).forEach(r => {
                totalSuccess += r.successful_operations;
                totalFailure += r.failed_operations;
                totalLatency += r.avg_latency_ms;
                count++;
            });

            document.getElementById('successValue').textContent = totalSuccess.toLocaleString();
            document.getElementById('failureValue').textContent = totalFailure.toLocaleString();
            document.getElementById('avgValue').textContent = (totalLatency / count).toFixed(2) + 'ms';
        }

        function updateLatencyChart(results) {
            const ctx = document.getElementById('latencyChart').getContext('2d');
            const services = Object.keys(results);
            const p50Data = services.map(s => results[s].p50_latency_ms);
            const p95Data = services.map(s => results[s].p95_latency_ms);
            const p99Data = services.map(s => results[s].p99_latency_ms);

            if (charts.latency) charts.latency.destroy();

            charts.latency = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: services,
                    datasets: [
                        {
                            label: 'P50',
                            data: p50Data,
                            backgroundColor: 'rgba(6, 182, 212, 0.7)'
                        },
                        {
                            label: 'P95',
                            data: p95Data,
                            backgroundColor: 'rgba(245, 158, 11, 0.7)'
                        },
                        {
                            label: 'P99',
                            data: p99Data,
                            backgroundColor: 'rgba(239, 68, 68, 0.7)'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: { color: '#cbd5e1' }
                        }
                    },
                    scales: {
                        y: {
                            ticks: { color: '#cbd5e1' },
                            grid: { color: 'rgba(51, 65, 85, 0.3)' }
                        },
                        x: {
                            ticks: { color: '#cbd5e1' },
                            grid: { color: 'rgba(51, 65, 85, 0.3)' }
                        }
                    }
                }
            });
        }

        function updateThroughputChart(results) {
            const ctx = document.getElementById('throughputChart').getContext('2d');
            const services = Object.keys(results);
            const throughputData = services.map(s => results[s].throughput_ops_per_sec);

            if (charts.throughput) charts.throughput.destroy();

            charts.throughput = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: services,
                    datasets: [{
                        label: 'ops/sec',
                        data: throughputData,
                        borderColor: '#06b6d4',
                        backgroundColor: 'rgba(6, 182, 212, 0.2)',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { labels: { color: '#cbd5e1' } }
                    },
                    scales: {
                        r: {
                            ticks: { color: '#cbd5e1' },
                            grid: { color: 'rgba(51, 65, 85, 0.3)' }
                        }
                    }
                }
            });
        }

        function updateResultsTable(results) {
            const tbody = document.getElementById('resultsTableBody');
            tbody.innerHTML = Object.entries(results).map(([name, r]) => `
                <tr>
                    <td><strong>${name}</strong></td>
                    <td>${r.total_operations.toLocaleString()}</td>
                    <td class="metric-value">${((r.successful_operations / r.total_operations) * 100).toFixed(2)}%</td>
                    <td class="metric-value">${r.avg_latency_ms.toFixed(2)}ms</td>
                    <td class="metric-value warning">${r.p95_latency_ms.toFixed(2)}ms</td>
                    <td class="metric-value danger">${r.p99_latency_ms.toFixed(2)}ms</td>
                    <td class="metric-value">${r.throughput_ops_per_sec.toFixed(2)}</td>
                </tr>
            `).join('');
        }

        async function startBenchmark() {
            benchmarkRunning = true;
            document.getElementById('statusValue').textContent = '运行中...';
            document.getElementById('statusValue').parentElement.parentElement.style.borderColor = 'var(--warning)';
            document.getElementById('progressCard').classList.remove('hidden');

            // 模拟进度
            for (let i = 0; i <= 100; i += 5) {
                document.getElementById('progressFill').style.setProperty('--progress', i + '%');
                document.getElementById('progressText').textContent = i + '%';
                await new Promise(r => setTimeout(r, 300));
            }

            // 生成结果
            mockResults = generateMockResults();
            updateStatusCards(mockResults);
            updateLatencyChart(mockResults);
            updateThroughputChart(mockResults);
            updateResultsTable(mockResults);

            document.getElementById('statusValue').textContent = '完成';
            document.getElementById('statusValue').parentElement.parentElement.style.borderColor = 'var(--success)';
            benchmarkRunning = false;

            showNotification('压测完成！', 'success');
        }

        function stopBenchmark() {
            if (benchmarkRunning) {
                benchmarkRunning = false;
                document.getElementById('statusValue').textContent = '已停止';
                document.getElementById('progressCard').classList.add('hidden');
                showNotification('已停止压测', 'error');
            }
        }

        function showNotification(message, type = 'success') {
            const notif = document.createElement('div');
            notif.className = `notification ${type}`;
            notif.textContent = message;
            document.body.appendChild(notif);
            setTimeout(() => notif.remove(), 3000);
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            showNotification('仪表板已加载，点击"开始压测"开始测试', 'success');
        });
    </script>
</body>
</html>
